spring:
  application:
    name: zen-inventory-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventario_multisucursal}
    username: ${SPRING_DATASOURCE_USERNAME}
    # Sin valor por defecto: se define con SPRING_DATASOURCE_PASSWORD (en Docker viene de DB_PASSWORD, en .env)
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      # Las fotos de perfil se reducen en el servidor; aquí solo se acota lo que se acepta subir.
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    hibernate:
      # 'validate': JPA verifica que las entidades coincidan con el esquema.
      # Flyway es quien gestiona el DDL (CREATE TABLE, ALTER TABLE).
      # Esto evita conflictos entre Flyway y Hibernate.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Las listas (ventas, devoluciones, compras…) traen sus detalles en lotes de 200 en vez de una consulta por fila:
        # con miles de ventas, la lista pasaba de 49 s a unos pocos segundos.
        default_batch_fetch_size: 200

  flyway:
    # Flyway activo: aplica V1__init_schema.sql y V2__catalog_seed_data.sql al arrancar.
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false # Desactivamos para permitir el cambio de nombres en scripts antiguos
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET} # obligatoria: sin ella la app no arranca (en Docker viene de JWT_SECRET)
    expiration: 86400000 # 1 day in ms

# Logs: por defecto solo los de la aplicación. El SQL y los valores enlazados (que incluyen hashes de contraseña,
# correos y datos de clientes) NO se registran fuera del perfil "dev" (ver application-dev.yml).
logging:
  level:
    co.com.zenvory.inventario: INFO

# Integración con el frontend. Cada despliegue define sus orígenes: sin CORS_ALLOWED_ORIGINS no se permite
# ningún origen distinto del propio (el perfil "dev" permite localhost).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # Datos de la empresa que salen en la factura de venta. Vacíos = no se imprimen (el nombre y el prefijo sí tienen valor).
  company:
    name: ${COMPANY_NAME:Zen Inventory}
    tax-id: ${COMPANY_TAX_ID:}
    address: ${COMPANY_ADDRESS:}
    phone: ${COMPANY_PHONE:}
    invoice-prefix: ${COMPANY_INVOICE_PREFIX:FV}
    footer: ${COMPANY_INVOICE_FOOTER:Documento equivalente a factura de venta.}
  docs:
    # Swagger / OpenAPI abiertos sin autenticación: solo en "dev".
    public: ${APP_DOCS_PUBLIC:false}