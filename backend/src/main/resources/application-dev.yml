# Perfil de desarrollo (SPRING_PROFILES_ACTIVE=dev; es el valor por defecto de docker-compose.yml).
# Nunca debe activarse en producción: abre la documentación de la API y registra SQL.
spring:
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    # Consultas SQL. Para ver también los valores enlazados, subir temporalmente a TRACE
    # org.hibernate.orm.jdbc.bind (registra hashes de contraseña y datos personales: no dejarlo activo).
    org.hibernate.SQL: DEBUG

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  docs:
    public: true
