
services:
  # 1. Base de Datos
  db:
    image: postgres:16-alpine
    container_name: ${DB_CONTEINER_NAME}
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - zenvory-network

  # 2. pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: zenvory-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - zenvory-network

  # 3. Backend (Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zenvory-backend
    restart: on-failure
    # `docker compose watch`: vigila estos archivos y reconstruye solo este servicio cuando cambian.
    develop:
      watch:
        - action: rebuild
          path: ./backend/src
        - action: rebuild
          path: ./backend/pom.xml
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SECURITY_JWT_SECRET=${JWT_SECRET}
      # Perfil de la API: "dev" abre Swagger, permite CORS desde localhost y registra SQL. En producción: SPRING_PROFILES_ACTIVE=prod
      # y CORS_ALLOWED_ORIGINS=https://tu-dominio (sin definirla, no se permite ningún origen cruzado).
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "${SPRING_LOCAL_PORT}:8080"
    depends_on:
      - db
    networks:
      - zenvory-network

  # 4. Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zenvory-frontend
    restart: on-failure
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "${NEXT_PORT}:3000"
    depends_on:
      - backend
    networks:
      - zenvory-network

  # 5. Frontend (Angular) — convive con el de Next.js mientras dura la migración
  frontend-angular:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    container_name: zenvory-frontend-angular
    restart: on-failure
    # `docker compose watch`: vigila estos archivos y reconstruye solo este servicio cuando cambian.
    develop:
      watch:
        - action: rebuild
          path: ./frontend-angular/src
        - action: rebuild
          path: ./frontend-angular/nginx
        - action: rebuild
          path: ./frontend-angular/package.json
        - action: rebuild
          path: ./frontend-angular/package-lock.json
        - action: rebuild
          path: ./frontend-angular/angular.json
    environment:
      # nginx reenvía /api/* a esta dirección (red interna de Docker)
      - BACKEND_URL=http://backend:8080
    ports:
      - "${ANGULAR_PORT:-4200}:8080"
    depends_on:
      - backend
    networks:
      - zenvory-network

volumes:
  pgdata:

networks:
  zenvory-network:
    driver: bridge
