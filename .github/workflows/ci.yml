name: CI

on:
  push:
    branches: [master]
  pull_request:

# Una ejecución nueva de la misma rama cancela la anterior que siga en curso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # No necesita base de datos: los controladores y servicios se prueban con mocks (el test de contexto está desactivado).
      - name: Pruebas
        run: ./mvnw -B -ntp test

  frontend:
    name: Frontend Angular (lint, pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      # `npm test` y no `ng test`: su `pretest` limpia una caché de Vitest que da falsos verdes.
      - name: Pruebas (unitarias, componentes e integración HTTP con MSW)
        run: npm test
      # El build falla si el arranque supera el presupuesto de bundle de angular.json (800 kB).
      - name: Build de producción
        run: npm run build
