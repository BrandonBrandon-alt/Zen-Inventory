<header class="mb-6 flex animate-enter flex-wrap items-start justify-between gap-4">
  <div>
    <h1 class="font-title text-[28px] font-bold tracking-tight text-fg">Sucursales</h1>
    @if (!loading() && !error() && branches().length > 0) {
      <p class="mt-1 text-sm text-fg-subtle">{{ summary() }}</p>
    }
  </div>
  <button appButton type="button" (click)="openCreate()"><svg lucidePlus [size]="16" />Nueva sucursal</button>
</header>

<div class="mb-3 flex animate-enter-delayed flex-wrap items-center gap-3">
  <div class="min-w-52 max-w-80 flex-1">
    <app-form-field>
      <input appInput type="search" placeholder="Buscar por nombre, dirección o teléfono…" aria-label="Buscar sucursal" autocomplete="off" [value]="search()" (input)="onSearch($event)" />
      <svg data-slot="prefix" lucideSearch [size]="16" aria-hidden="true"></svg>
    </app-form-field>
  </div>
  <div class="w-52"><app-select [(value)]="statusFilter" [options]="statusOptions" ariaLabel="Estado de la sucursal" /></div>
  <div class="w-52"><app-select [(value)]="managerFilter" [options]="managerOptions" ariaLabel="Gerente de la sucursal" /></div>
</div>
<app-active-filters class="mb-4 animate-enter-delayed" [filters]="activeFilters()" (removed)="removeFilter($event)" (cleared)="clearFilters()" />

<app-data-table
  exportName="sucursales"
  persistKey="sucursales"
  class="block animate-enter-delayed"
  caption="Listado de sucursales"
  [columns]="columns"
  [rows]="rows()"
  [rowKey]="rowKey"
  [loading]="loading()"
  [error]="error()"
  [pageSize]="10"
  [emptyTitle]="activeFilters().length > 0 ? 'Ninguna sucursal coincide' : 'Todavía no hay sucursales'"
  [emptyDescription]="activeFilters().length > 0 ? 'Prueba quitando algún filtro.' : 'Las sucursales que se registren aparecerán aquí.'"
  (retry)="load()"
>
  <ng-template appCell="activa" let-branch>
    <app-badge [variant]="branch.activa ? 'success' : 'neutral'" dot>{{ branch.activa ? 'Activa' : 'Inactiva' }}</app-badge>
  </ng-template>
  <ng-template appCell="acciones" let-branch>
    <div class="flex justify-end gap-1">
      <button appButton variant="ghost-brand" size="sm" type="button" [attr.aria-label]="'Editar ' + branch.nombre" appTooltip="Editar sucursal" (click)="openEdit(branch)">
        <svg lucidePencil [size]="16" />
      </button>
      @if (branch.activa) {
        <button appButton variant="ghost-danger" size="sm" type="button" [attr.aria-label]="'Desactivar ' + branch.nombre" appTooltip="Desactivar sucursal" (click)="askDeactivate(branch)">
          <svg lucideBan [size]="16" />
        </button>
      }
    </div>
  </ng-template>
</app-data-table>

<app-branch-form-modal [(open)]="formOpen" [branch]="editing()" (saved)="load(true)" />

<app-confirm-dialog
  [(open)]="confirmOpen"
  title="Desactivar sucursal"
  [message]="'¿Desactivar la sucursal ' + (deactivating()?.nombre ?? '') + '? Dejará de estar disponible para nuevas operaciones.'"
  confirmLabel="Desactivar"
  [busy]="deactivateBusy()"
  [error]="deactivateError()"
  (confirmed)="confirmDeactivate()"
/>
