<header class="mb-6 flex animate-enter flex-wrap items-start justify-between gap-4">
  <div>
    <h1 class="font-title text-[28px] font-bold tracking-tight text-fg">Compras</h1>
    @if (!loading() && !error()) {
      <p class="mt-1 text-sm text-fg-subtle">
        {{ summary() }}@if (pending() > 0) {, {{ pending() === 1 ? '1 espera tu acción' : pending() + ' esperan tu acción' }}}
      </p>
    }
  </div>
  <button appButton type="button" (click)="formOpen.set(true)"><svg lucidePlus [size]="16" />Nueva orden de compra</button>
</header>

<div class="mb-3 flex animate-enter-delayed flex-wrap items-center gap-3">
  <div class="w-64 max-w-full">
    <app-form-field>
      <input appInput type="search" placeholder="Buscar por n.º o proveedor…" aria-label="Buscar orden" autocomplete="off" [value]="search()" (input)="onSearch($event)" />
      <svg data-slot="prefix" lucideSearch [size]="16" aria-hidden="true"></svg>
    </app-form-field>
  </div>
  <div class="w-56">
    <app-select [(value)]="statusFilter" [options]="statusOptions" [icon]="filterIcon" ariaLabel="Estado de la orden" />
  </div>
  <div class="w-52"><app-select [(value)]="paymentFilter" [options]="paymentOptions" [icon]="paymentIcon" ariaLabel="Estado del pago" /></div>
  <div class="w-44"><app-date-picker [(value)]="from" [max]="to()" placeholder="Desde" ariaLabel="Desde" /></div>
  <div class="w-44"><app-date-picker [(value)]="to" [min]="from()" placeholder="Hasta" ariaLabel="Hasta" /></div>
  <app-advanced-filters [(open)]="advancedOpen" [activeCount]="advancedCount()" class="basis-full">
    <app-select [(value)]="supplierFilter" [options]="supplierOptions()" ariaLabel="Proveedor" searchable searchPlaceholder="Buscar proveedor…" />
    @if (isAdmin()) {
      <app-select [(value)]="branchFilter" [options]="branchOptions()" ariaLabel="Sucursal" />
    }
    <app-select [(value)]="productFilter" [options]="productOptions()" ariaLabel="Producto" searchable searchPlaceholder="Buscar producto…" />
    <app-form-field label="Total desde">
      <input appInput type="number" min="0" step="any" inputmode="decimal" [value]="minTotal() ?? ''" (input)="minTotal.set(numberFromInput($event))" />
    </app-form-field>
    <app-form-field label="Total hasta">
      <input appInput type="number" min="0" step="any" inputmode="decimal" [value]="maxTotal() ?? ''" (input)="maxTotal.set(numberFromInput($event))" />
    </app-form-field>
    <label class="flex items-center gap-2 text-sm text-fg-muted">
      <input type="checkbox" class="size-4 accent-[var(--brand-500)]" [checked]="onlyMine()" (change)="onlyMine.set($any($event.target).checked)" />
      Solo las que esperan mi acción
    </label>
  </app-advanced-filters>
</div>
<app-active-filters class="mb-4 animate-enter-delayed" [filters]="activeFilters()" (removed)="removeFilter($event)" (cleared)="clearFilters()" />

<app-data-table
  exportName="compras"
  persistKey="compras"
  class="block animate-enter-delayed"
  caption="Órdenes de compra"
  [columns]="columns()"
  [rows]="rows()"
  [rowKey]="rowKey"
  [loading]="loading()"
  [error]="error()"
  [pageSize]="10"
  [clickableRows]="true"
  [emptyTitle]="activeFilters().length === 0 ? 'No hay órdenes en curso' : 'Ninguna orden coincide'"
  [emptyDescription]="activeFilters().length === 0 ? 'Crea una orden para pedir mercancía a un proveedor.' : 'Prueba quitando algún filtro.'"
  minWidth="54rem"
  (rowClick)="openDetail($event)"
  (retry)="load()"
>
  <ng-template appCell="receptionLabel" let-p>
    <span class="inline-flex items-center gap-2">
      <app-badge [variant]="receptionVariant(p)" dot>{{ p.receptionLabel }}</app-badge>
      @if (p.needsMe) {
        <span class="rounded-full bg-brand/15 px-2 py-0.5 text-[11px] font-semibold text-brand">Te toca</span>
      }
    </span>
  </ng-template>
  <ng-template appCell="paymentLabel" let-p>
    <app-badge [variant]="paymentVariant(p)">{{ p.paymentLabel }}</app-badge>
  </ng-template>
  <ng-template appCell="acciones" let-p>
    <div class="flex justify-end">
      <button appButton variant="ghost-brand" size="sm" type="button" [attr.aria-label]="'Ver orden ' + p.id" appTooltip="Ver detalle" (click)="openDetail(p)">
        <svg lucideEye [size]="16" />
      </button>
    </div>
  </ng-template>
</app-data-table>

<app-purchase-form-modal
  [(open)]="formOpen"
  [suppliers]="suppliers()"
  [products]="products()"
  [branches]="branches()"
  [chooseBranch]="isAdmin()"
  (saved)="load(true)"
/>

<app-purchase-detail-modal
  [(open)]="detailOpen"
  [purchase]="selected()"
  [role]="role()"
  [supplierName]="selectedSupplier()"
  [branchName]="selectedBranch()"
  [productNames]="productNames()"
  (changed)="load(true)"
/>
