<header class="mb-6 flex animate-enter flex-wrap items-start justify-between gap-4">
  <div>
    <h1 class="font-title text-[28px] font-bold tracking-tight text-fg">Alertas</h1>
    @if (!loading() && !error()) {
      <p class="mt-1 text-sm text-fg-subtle">{{ summary() }}</p>
    }
  </div>
  @if (isAdmin()) {
    <button
      appButton
      variant="ghost"
      type="button"
      appTooltip="Revisa el stock de todas las sucursales y crea las alertas que falten"
      [loading]="scanning()"
      (click)="scan()"
    >
      <svg lucideScanSearch [size]="16" aria-hidden="true"></svg>
      Revisar stock
    </button>
  }
</header>

<div class="mb-4 flex animate-enter-delayed flex-wrap gap-3">
  @if (isAdmin() && branches().length > 0) {
    <div class="w-64">
      <app-select [value]="branchFilter()" (valueChange)="setBranch($event)" [options]="branchOptions()" [icon]="storeIcon" ariaLabel="Sucursal" />
    </div>
  }
  @if (alerts().length > 0) {
    <div class="w-56">
      <app-select [(value)]="typeFilter" [options]="typeOptions()" [icon]="tagIcon" ariaLabel="Tipo de alerta" />
    </div>
  }
</div>

<app-data-table
  exportName="alertas"
  class="block animate-enter-delayed"
  caption="Alertas activas"
  [columns]="columns()"
  [rows]="rows()"
  [rowKey]="rowKey"
  [loading]="loading()"
  [error]="error()"
  [pageSize]="10"
  [emptyTitle]="typeFilter() ? 'Ninguna alerta de este tipo' : 'No hay alertas activas'"
  [emptyDescription]="typeFilter() ? 'Prueba con otro tipo.' : 'Todo está en orden: ningún producto necesita atención.'"
  minWidth="52rem"
  (retry)="load()"
>
  <ng-template appCell="typeLabel" let-alert>
    <app-badge [variant]="variantOf(alert)">{{ alert.typeLabel }}</app-badge>
  </ng-template>
  <ng-template appCell="acciones" let-alert>
    @if (canResolve(alert)) {
      <div class="flex justify-end">
        <button appButton variant="ghost-brand" size="sm" type="button" [attr.aria-label]="'Resolver alerta de ' + alert.product" (click)="openResolve(alert)">
          <svg lucideCircleCheck [size]="16" aria-hidden="true"></svg>
          Resolver
        </button>
      </div>
    }
  </ng-template>
</app-data-table>

<app-alert-resolution-modal
  [(open)]="resolveOpen"
  [alert]="resolving()"
  [productName]="resolvingName()"
  [branches]="branches()"
  [canDismiss]="canDismiss()"
  (resolved)="load(true)"
/>
