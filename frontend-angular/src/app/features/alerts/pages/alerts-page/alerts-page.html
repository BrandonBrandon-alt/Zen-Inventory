<header class="mb-6 flex animate-enter flex-wrap items-start justify-between gap-4">
  <div>
    <h1 class="font-title text-[28px] font-bold tracking-tight text-fg">Alertas</h1>
    @if (!loading() && !error()) {
      <p class="mt-1 text-sm text-fg-subtle">{{ summary() }}</p>
    }
  </div>
  @if (isAdmin()) {
    <button
      appButton
      variant="ghost"
      type="button"
      appTooltip="Revisa el stock de todas las sucursales y crea las alertas que falten"
      [loading]="scanning()"
      (click)="scan()"
    >
      <svg lucideScanSearch [size]="16" aria-hidden="true"></svg>
      Revisar stock
    </button>
  }
</header>

<div class="mb-3 flex animate-enter-delayed flex-wrap items-center gap-3">
  <div class="min-w-52 max-w-72 flex-1">
    <app-form-field>
      <input appInput type="search" placeholder="Buscar producto o detalle…" aria-label="Buscar alerta" autocomplete="off" [value]="search()" (input)="onSearch($event)" />
      <svg data-slot="prefix" lucideSearch [size]="16" aria-hidden="true"></svg>
    </app-form-field>
  </div>
  @if (isAdmin() && branches().length > 0) {
    <div class="w-64">
      <app-select [value]="branchFilter()" (valueChange)="setBranch($event)" [options]="branchOptions()" [icon]="storeIcon" ariaLabel="Sucursal" />
    </div>
  }
  @if (alerts().length > 0 || typeFilter()) {
    <div class="w-56">
      <app-select [(value)]="typeFilter" [options]="typeOptions()" [icon]="tagIcon" ariaLabel="Tipo de alerta" />
    </div>
  }
  <div class="w-36"><app-date-picker [(value)]="from" [max]="to()" placeholder="Desde" ariaLabel="Desde" /></div>
  <div class="w-36"><app-date-picker [(value)]="to" [min]="from()" placeholder="Hasta" ariaLabel="Hasta" /></div>
  <app-advanced-filters [(open)]="advancedOpen" [activeCount]="advancedCount()" class="basis-full">
    <app-form-field label="Producto"><app-select [(value)]="productFilter" [options]="productOptions()" ariaLabel="Producto" searchable searchPlaceholder="Buscar producto…" /></app-form-field>
  </app-advanced-filters>
</div>
<app-active-filters class="mb-4 animate-enter-delayed" [filters]="activeFilters()" (removed)="removeFilter($event)" (cleared)="clearFilters()" />

<app-data-table
  exportName="alertas"
  persistKey="alertas"
  class="block animate-enter-delayed"
  caption="Alertas activas"
  [columns]="columns()"
  [rows]="rows()"
  [rowKey]="rowKey"
  [loading]="loading()"
  [error]="error()"
  [pageSize]="10"
  [emptyTitle]="activeFilters().length > 0 ? 'Ninguna alerta coincide' : 'No hay alertas activas'"
  [emptyDescription]="activeFilters().length > 0 ? 'Prueba quitando algún filtro.' : 'Todo está en orden: ningún producto necesita atención.'"
  minWidth="52rem"
  (retry)="load()"
>
  <ng-template appCell="typeLabel" let-alert>
    <app-badge [variant]="variantOf(alert)">{{ alert.typeLabel }}</app-badge>
  </ng-template>
  <ng-template appCell="acciones" let-alert>
    @if (canResolve(alert)) {
      <div class="flex justify-end">
        <button appButton variant="ghost-brand" size="sm" type="button" [attr.aria-label]="'Resolver alerta de ' + alert.product" (click)="openResolve(alert)">
          <svg lucideCircleCheck [size]="16" aria-hidden="true"></svg>
          Resolver
        </button>
      </div>
    }
  </ng-template>
</app-data-table>

<app-alert-resolution-modal
  [(open)]="resolveOpen"
  [alert]="resolving()"
  [productName]="resolvingName()"
  [branches]="branches()"
  [canDismiss]="canDismiss()"
  (resolved)="load(true)"
/>
