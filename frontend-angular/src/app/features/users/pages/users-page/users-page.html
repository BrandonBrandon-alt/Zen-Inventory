<header class="mb-6 flex animate-enter flex-wrap items-start justify-between gap-4">
  <div>
    <h1 class="font-title text-[28px] font-bold tracking-tight text-fg">Usuarios</h1>
    @if (!loading() && !error() && users().length > 0) {
      <p class="mt-1 text-sm text-fg-subtle">
        {{ summary() }}@if (isManager()) {
          <span> en tu sucursal</span>
        }
      </p>
    }
  </div>
  <button appButton type="button" [disabled]="!canOpenForm()" (click)="openCreate()">
    <svg lucidePlus [size]="16" />Nuevo usuario
  </button>
</header>

<app-data-table
  exportName="usuarios"
  class="block animate-enter-delayed"
  caption="Listado de usuarios"
  [columns]="columns"
  [rows]="rows()"
  [rowKey]="rowKey"
  [loading]="loading()"
  [error]="error()"
  [pageSize]="10"
  minWidth="52rem"
  emptyTitle="Todavía no hay usuarios"
  emptyDescription="Los usuarios que se registren aparecerán aquí."
  (retry)="load()"
>
  <ng-template appCell="nombre" let-user>
    <span class="flex items-center gap-3">
      <app-user-avatar [userId]="user.id" [name]="user.nombre" [version]="user.avatarVersion" size="sm" />
      <span class="min-w-0 truncate">{{ user.nombre }}</span>
    </span>
  </ng-template>
  <ng-template appCell="rol" let-user>
    <app-badge [variant]="roleVariant(user)">{{ user.rol }}</app-badge>
  </ng-template>
  <ng-template appCell="activo" let-user>
    <app-badge [variant]="user.activo ? 'success' : 'neutral'" dot>{{ user.activo ? 'Activo' : 'Inactivo' }}</app-badge>
  </ng-template>
  <ng-template appCell="acciones" let-user>
    <div class="flex justify-end gap-1">
      @if (canManage(user) && canOpenForm()) {
        <button appButton variant="ghost-brand" size="sm" type="button" [attr.aria-label]="'Editar ' + user.nombre" appTooltip="Editar usuario" (click)="openEdit(user)">
          <svg lucidePencil [size]="16" />
        </button>
      }
      @if (canDeactivate(user)) {
        <button appButton variant="ghost-danger" size="sm" type="button" [attr.aria-label]="'Desactivar ' + user.nombre" appTooltip="Desactivar usuario" (click)="askDeactivate(user)">
          <svg lucideBan [size]="16" />
        </button>
      }
    </div>
  </ng-template>
</app-data-table>

<app-user-form-modal
  [(open)]="formOpen"
  [user]="editing()"
  [roles]="roles()"
  [branches]="branches()"
  [branchLocked]="isManager()"
  [self]="editing()?.id === currentUserId()"
  (saved)="load(true)"
/>

<app-confirm-dialog
  [(open)]="confirmOpen"
  title="Desactivar usuario"
  [message]="'¿Desactivar a ' + (deactivating()?.nombre ?? '') + '? Ya no podrá iniciar sesión.'"
  confirmLabel="Desactivar"
  [busy]="deactivateBusy()"
  [error]="deactivateError()"
  (confirmed)="confirmDeactivate()"
/>
