<header class="mb-6 flex animate-enter flex-wrap items-start justify-between gap-4">
  <div>
    <h1 class="font-title text-[28px] font-bold tracking-tight text-fg">Proveedores</h1>
    @if (!loading() && !error() && suppliers().length > 0) {
      <p class="mt-1 text-sm text-fg-subtle">{{ summary() }}</p>
    }
  </div>
  <button appButton type="button" (click)="openCreate()"><svg lucidePlus [size]="16" />Nuevo proveedor</button>
</header>

<div class="mb-3 flex animate-enter-delayed flex-wrap items-center gap-3">
  <div class="min-w-52 max-w-80 flex-1">
    <app-form-field>
      <input appInput type="search" placeholder="Buscar por nombre o contacto…" aria-label="Buscar proveedor" autocomplete="off" [value]="search()" (input)="onSearch($event)" />
      <svg data-slot="prefix" lucideSearch [size]="16" aria-hidden="true"></svg>
    </app-form-field>
  </div>
  <div class="w-60"><app-select [(value)]="deliveryFilter" [options]="deliveryOptions" ariaLabel="Plazo de entrega" /></div>
</div>
<app-active-filters class="mb-4 animate-enter-delayed" [filters]="activeFilters()" (removed)="removeFilter($event)" (cleared)="clearFilters()" />

<app-data-table
  exportName="proveedores"
  persistKey="proveedores"
  class="block animate-enter-delayed"
  caption="Listado de proveedores"
  [columns]="columns"
  [rows]="rows()"
  [rowKey]="rowKey"
  [loading]="loading()"
  [error]="error()"
  [pageSize]="10"
  [emptyTitle]="activeFilters().length > 0 ? 'Ningún proveedor coincide' : 'Todavía no hay proveedores'"
  [emptyDescription]="activeFilters().length > 0 ? 'Prueba quitando algún filtro.' : 'Registra el primero para poder asociarlo a los productos.'"
  (retry)="load()"
>
  <ng-template appCell="acciones" let-supplier>
    <div class="flex justify-end gap-1">
      <button appButton variant="ghost-brand" size="sm" type="button" [attr.aria-label]="'Editar ' + supplier.nombre" appTooltip="Editar proveedor" (click)="openEdit(supplier)">
        <svg lucidePencil [size]="16" />
      </button>
      <button appButton variant="ghost-danger" size="sm" type="button" [attr.aria-label]="'Eliminar ' + supplier.nombre" appTooltip="Eliminar proveedor" (click)="askDelete(supplier)">
        <svg lucideTrash2 [size]="16" />
      </button>
    </div>
  </ng-template>
</app-data-table>

<app-supplier-form-modal [(open)]="formOpen" [supplier]="editing()" (saved)="load(true)" />

<app-confirm-dialog
  [(open)]="confirmOpen"
  title="Eliminar proveedor"
  [message]="'¿Eliminar al proveedor ' + (deleting()?.nombre ?? '') + '? Esta acción no se puede deshacer.'"
  confirmLabel="Eliminar"
  [busy]="deleteBusy()"
  [error]="deleteError()"
  (confirmed)="confirmDelete()"
/>
